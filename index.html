<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mai Senza Check List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1>Bar Mai Senza</h1>
      <div class="sub" id="dateLabel"></div>
    </div>
    <button class="link-btn" id="switchEmployeeBtn" style="display:none;">cambia dipendente</button>
    <button class="link-btn" id="logoutBtn" style="display:none;">esci</button>
  </div>
</header>
<main>
  <div id="employeeScreen">
    <p>Inserisci il tuo codice personale</p>
    <form id="codeForm" class="code-form-wrap">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="codeInput" class="code-input" placeholder="····" autocomplete="off">
      <div class="shift-row">
        <label style="font-size:0.85rem;color:var(--muted);">Dalle
          <input type="time" id="shiftStart">
        </label>
        <label style="font-size:0.85rem;color:var(--muted);">Alle
          <input type="time" id="shiftEnd">
        </label>
      </div>
      <button type="submit" class="code-submit">Entra</button>
    </form>
    <div class="code-error" id="codeError"></div>
  </div>

  <div id="checklistScreen" style="display:none;">
    <div id="taskContainer"></div>
  </div>

  <div id="adminScreen" style="display:none;">

    <div class="section-title">Dipendenti</div>
    <div class="admin-form-inline" style="margin-bottom:10px;">
      <label for="hoursMonthPicker" style="align-self:center;font-size:0.85rem;color:var(--muted);">Ore lavorate del mese:</label>
      <input type="month" id="hoursMonthPicker">
    </div>
    <table class="report" id="employeeTable">
      <thead><tr><th>Nome</th><th>Codice (GGMM)</th><th>Ore lavorate (mese selezionato)</th><th>Attivo</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <form id="newEmployeeForm" class="admin-form-inline">
      <input type="text" id="newEmpName" placeholder="Nome dipendente" required>
      <input type="tel" id="newEmpCode" placeholder="GGMM" maxlength="4" required>
      <button type="submit" class="code-submit">Aggiungi</button>
    </form>

    <div class="section-title" style="margin-top:28px;">Mansioni</div>
    <table class="report" id="taskTable">
      <thead><tr><th>Sezione</th><th>Giorno</th><th>Mansione</th><th>Attiva</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <form id="newTaskForm" class="admin-form-inline">
      <select id="newTaskSection">
        <option value="apertura">Apertura</option>
        <option value="pranzo">Pranzo</option>
        <option value="chiusura">Chiusura</option>
        <option value="settimanale">Settimanale</option>
      </select>
      <div id="newTaskDays" class="day-checks" style="display:none;">
        <label><input type="checkbox" value="lunedi"> Lun</label>
        <label><input type="checkbox" value="martedi"> Mar</label>
        <label><input type="checkbox" value="mercoledi"> Mer</label>
        <label><input type="checkbox" value="giovedi"> Gio</label>
        <label><input type="checkbox" value="venerdi"> Ven</label>
        <label><input type="checkbox" value="sabato"> Sab</label>
        <label><input type="checkbox" value="domenica"> Dom</label>
      </div>
      <input type="text" id="newTaskLabel" placeholder="Nome mansione" required>
      <button type="submit" class="code-submit">Aggiungi</button>
    </form>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
</body>
</html>
