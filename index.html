<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Mai Senza - Check List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1>Bar Mai Senza</h1>
      <div class="sub" id="dateLabel"></div>
    </div>
    <button class="link-btn" id="switchEmployeeBtn" style="display:none;">cambia dipendente</button>
  </div>
</header>
<main>
  <div id="employeeScreen">
    <p>Inserisci il tuo codice personale (giorno e mese di nascita)</p>
    <form id="codeForm" class="code-form">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="codeInput" class="code-input" placeholder="GGMM" autocomplete="off">
      <button type="submit" class="code-submit">Entra</button>
    </form>
    <div class="code-error" id="codeError"></div>
  </div>

  <div id="checklistScreen" style="display:none;">
    <div id="taskContainer"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
