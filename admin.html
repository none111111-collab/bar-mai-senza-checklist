<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pannello Titolare - Bar Mai Senza</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1>Pannello Titolare</h1>
      <div class="sub">Gestione dipendenti e mansioni</div>
    </div>
    <button class="link-btn" id="logoutBtn" style="display:none;">esci</button>
  </div>
</header>
<main>

  <div id="loginScreen">
    <p>Accedi con la tua email e password</p>
    <form id="loginForm" class="admin-form">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="code-submit">Accedi</button>
    </form>
    <div class="code-error" id="loginError"></div>
  </div>

  <div id="adminScreen" style="display:none;">

    <div class="section-title">Dipendenti</div>
    <table class="report" id="employeeTable">
      <thead><tr><th>Nome</th><th>Codice (GGMM)</th><th>Attivo</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <form id="newEmployeeForm" class="admin-form-inline">
      <input type="text" id="newEmpName" placeholder="Nome dipendente" required>
      <input type="tel" id="newEmpCode" placeholder="GGMM" maxlength="4" required>
      <button type="submit" class="code-submit">Aggiungi</button>
    </form>

    <div class="section-title" style="margin-top:28px;">Mansioni</div>
    <table class="report" id="taskTable">
      <thead><tr><th>Sezione</th><th>Giorno</th><th>Mansione</th><th>Attiva</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <form id="newTaskForm" class="admin-form-inline">
      <select id="newTaskSection">
        <option value="apertura">Apertura</option>
        <option value="pranzo">Pranzo</option>
        <option value="chiusura">Chiusura</option>
        <option value="settimanale">Settimanale</option>
      </select>
      <select id="newTaskDay" style="display:none;">
        <option value="lunedi">Lunedi</option>
        <option value="martedi">Martedi</option>
        <option value="mercoledi">Mercoledi</option>
        <option value="giovedi">Giovedi</option>
        <option value="venerdi">Venerdi</option>
        <option value="sabato">Sabato</option>
        <option value="domenica">Domenica</option>
      </select>
      <input type="text" id="newTaskLabel" placeholder="Nome mansione" required>
      <button type="submit" class="code-submit">Aggiungi</button>
    </form>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
